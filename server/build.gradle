plugins {
    id 'java'
    id 'org.springframework.boot' version '4.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.overdozya'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'com.networknt:json-schema-validator:3.0.9'   // Jackson 3(tools.jackson) 기반
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 06 4.4: 코드 판(git 짧은 해시, 고친 파일이 있으면 -dirty)을 리소스에 넣는다
def codeVersion = providers.exec {
    commandLine 'sh', '-c', 'h=$(git rev-parse --short HEAD 2>/dev/null || echo unknown); ' +
            'if [ -n "$(git status --porcelain -- . 2>/dev/null)" ]; then echo "$h-dirty"; else echo "$h"; fi'
    ignoreExitValue = true
}.standardOutput.asText.map { it.trim() }

tasks.named('processResources') {
    inputs.property('codeVersion', codeVersion)
    filesMatching('code-version.properties') {
        expand(codeVersion: codeVersion.get())
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // 테스트는 server/.env를 읽지 않는다(키·DB 값이 테스트에 섞이지 않게)
    systemProperty 'spring.config.import', 'optional:file:./.env.test-none,classpath:code-version.properties'
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

tasks.named('bootRun') {
    workingDir = projectDir
}
