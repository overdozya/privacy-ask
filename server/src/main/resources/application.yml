# 06 1.4. .env(KEY=VALUE)를 속성 파일로 읽는다. 서버는 server/에서 띄운다.
spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - classpath:code-version.properties
  application:
    name: privacy-ask
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/privacyask}
    username: ${DB_USER:privacyask}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
        rewriteBatchedStatements: true
        characterEncoding: UTF-8
  flyway:
    locations: classpath:db/migration
    out-of-order: false
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  address: 127.0.0.1
  port: 8080

app:
  data-dir: ${PRIVACYASK_DATA_DIR:../data}
  # 지식 스냅샷(pa/knowledge)이 기동 때 data-dir/out/mysql/manifest.json과 행 수·참조를 견준다(06 3.1)
  # 한 턴 흐름(pa/flow, 06 3.4·6.1·6.3)
  flow:
    speculative-a1: true    # 첫 요청에서 A0 ‖ A1을 같이 띄움(A0이 구체가 아니면 A1을 버림, llm_call_logs.discarded=1)
    turn-timeout: 60s       # 한 턴 상한(현업 turn_timeout_sec 60). 넘으면 503 TURN_TIMEOUT
  # A2 질문 순서(메인 결정 2026-11-27): RULE = 슬롯 계산 순서 → 변환 규칙 ord(앞 규칙이 등급이 높은 값부터). CATALOG = fact_catalog.ord
  question:
    order: RULE
    # 멈춤 규칙(S7b 메인 결정 2026-11-27): 후보를 바뀌는 것이 큰 순(사안 등급·출구 > 쟁점 이름 > 쟁점 등급 > 조건 등)으로 묻고,
    # 사안당 질문 6개(다시 묻기 포함)를 넘으면 사안 등급·출구를 바꿀 수 있는 질문만 더 묻는다. 남은 후보는 결과 unasked에.
    priority: IMPACT
    max-per-case: 6
  llm:
    provider: ${LLM_PROVIDER:fake}
    model: ${LLM_MODEL:gemini-3.6-flash}
    temperature: ${LLM_TEMPERATURE:0}
    api-key: ${LLM_API_KEY:}
    call-timeout: 20s       # 06 6.1 호출 하나 상한
    retry-backoff: 1s       # 전송 재시도 기다림(+ 0~1초 흔들림)
    ping-on-startup: false  # true면 기동 뒤 S0_ping 한 번(06 7절 S2 ⑤)
    gemini:
      base-url: https://generativelanguage.googleapis.com/v1beta
      send-schema: true     # 모델이 스키마를 거부하면 false(검증은 어차피 우리 쪽)
      send-temperature: true

logging:
  level:
    org.flywaydb: info
